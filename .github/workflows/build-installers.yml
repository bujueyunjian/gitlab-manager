name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-26
            args: --target universal-apple-darwin --bundles dmg -- --locked
          - name: Windows x64
            os: windows-2025
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi -- --locked
          - name: Linux x64
            os: ubuntu-24.04
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage -- --locked
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            args: --target aarch64-unknown-linux-gnu --bundles deb,appimage -- --locked

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { strict as assert } from 'node:assert';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match the application version');
          NODE
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf xdg-utils
      - name: Set up Rust
        run: rustup update stable --no-self-update
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check frontend and source privacy
        run: pnpm check
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # The official action handles package discovery and uploads, without a custom release script.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: GitLab Manager v__VERSION__
          releaseBody: "早期版本。请按系统和架构下载附件；签名状态和安装要求见仓库 README。"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[mainBinaryName]-[version]-[platform]-[arch]-[bundle]"

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Keep the release in draft until every platform has uploaded its installers.
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
